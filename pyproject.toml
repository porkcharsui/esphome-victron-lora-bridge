[project]
name = "victron-ble-lora-bridge"
version = "0.1.0"
description = "Victron BLE telemetry bridge for ESPHome and Meshtastic"
requires-python = ">=3.12,<3.14"
dependencies = []

[dependency-groups]
dev = [
  "esphome==2026.7.3",
  "platformio==6.1.19",
  "python-dotenv==1.1.1",
  "pytest==8.4.1",
  "ruff==0.12.7",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

; External build overlay for Victron-enabled Meshtastic firmware.
; From the repository root, pass --project-conf "$PWD/meshtastic/platformio-victron.ini".

[platformio]
extra_configs =
  platformio.ini
test_dir = ../victron/test

[env:tlora-v1-victron]
extends = env:tlora-v1
custom_meshtastic_display_name = LILYGO T-LoRa V1 Victron
extra_scripts =
  ${esp32_base.extra_scripts}
  pre:../victron/platformio_victron.py
build_flags =
  ${env:tlora-v1.build_flags}
  -DHAS_VICTRON_BLE=1
  -DMESHTASTIC_EXCLUDE_DEVICE_TELEMETRY=1
custom_sdkconfig =
  ${esp32_base.custom_sdkconfig}
  CONFIG_BT_NIMBLE_ROLE_OBSERVER=y

[env:t-echo-victron]
extends = env:t-echo
custom_meshtastic_display_name = LILYGO T-Echo Victron
extra_scripts =
  ${nrf52_base.extra_scripts}
  pre:../victron/platformio_victron.py
build_flags =
  ${env:t-echo.build_flags}
  -DHAS_VICTRON_BLE=1
  -DMESHTASTIC_EXCLUDE_DEVICE_TELEMETRY=1

[env:victron-native]
platform = native
extra_scripts =
test_framework = unity
test_build_src = false
build_flags =
  -std=gnu++17
  -I../victron/src
  -I../victron/test/include
lib_deps =
  https://github.com/meshtastic/Crypto/archive/591ff9a690e8168ccb7a36abde8d7783e448d395.zip
